name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Get the PR that was merged to main
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.repos.listCommitsOnHead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });

            const commit = commits.data[0];
            const prResponse = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commit.sha,
            });

            if (prResponse.data.length > 0) {
              const pr = prResponse.data[0];
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_body', pr.body || '');
            }

      # Extract CodeRabbit release notes from PR
      - name: Extract CodeRabbit release notes
        id: coderabbit
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ steps.pr.outputs.pr_number }}';
            if (!prNumber) {
              core.setOutput('notes', '');
              return;
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
            });

            const coderabbitComment = comments.data.find(comment =>
              comment.user.login === 'coderabbitai' &&
              comment.body.includes('## Summary by CodeRabbit')
            );

            if (coderabbitComment) {
              // Extract the Release Notes section
              const releaseNotesMatch = coderabbitComment.body.match(
                /## Release Notes([\s\S]*?)(?=---|\Z)/
              );
              if (releaseNotesMatch) {
                core.setOutput('notes', releaseNotesMatch[1].trim());
              }
            }

      # Parse CHANGELOG to extract [Unreleased] section
      - name: Extract CHANGELOG [Unreleased]
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            // Extract [Unreleased] section
            const unreleasedMatch = changelog.match(
              /## \[Unreleased\]\n([\s\S]*?)(?=\n## \[|$)/
            );

            if (unreleasedMatch) {
              const unreleasedContent = unreleasedMatch[1].trim();
              core.setOutput('unreleased', unreleasedContent);

              // Determine version bump based on content
              let bump = 'patch'; // default
              if (unreleasedContent.includes('### Added')) {
                bump = 'minor';
              }
              core.setOutput('bump_type', bump);
            } else {
              core.setOutput('unreleased', '');
              core.setOutput('bump_type', 'patch');
            }

      # Calculate next version
      - name: Calculate next version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const current = pkg.version;
            const [major, minor, patch] = current.split('.').map(Number);

            let next;
            if ('${{ steps.changelog.outputs.bump_type }}' === 'minor') {
              next = `${major}.${minor + 1}.0`;
            } else {
              next = `${major}.${minor}.${patch + 1}`;
            }

            core.setOutput('current', current);
            core.setOutput('next', next);

      # Update package.json version
      - name: Update package.json
        run: |
          npm version ${{ steps.version.outputs.next }} --no-git-tag-v

      # Update CHANGELOG with new version
      - name: Update CHANGELOG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().split('T')[0];
            const newVersion = '${{ steps.version.outputs.next }}';

            let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');

            // Replace [Unreleased] with versioned entry
            const releaseHeader = `## [${newVersion}] - ${today}`;
            changelog = changelog.replace(
              '## [Unreleased]',
              `## [Unreleased]\n\n${releaseHeader}`
            );

            // Add comparison link at the bottom
            const previousVersion = '${{ steps.version.outputs.current }}';
            const compareLink = `\n[${newVersion}]: https://github.com/${{ github.repository }}/compare/v${previousVersion}...v${newVersion}`;

            // Insert before the previous version's link if it exists
            const previousLink = new RegExp(`\\n\\[${previousVersion}\\]:`, 'g');
            if (previousLink.test(changelog)) {
              changelog = changelog.replace(previousLink, compareLink + '\n[${ previousVersion }]:');
            } else {
              changelog += compareLink;
            }

            fs.writeFileSync('CHANGELOG.md', changelog);

      # Prepare release notes
      - name: Prepare release notes
        id: release_notes
        run: |
          {
            echo "notes<<EOF"
            if [ -n "${{ steps.coderabbit.outputs.notes }}" ]; then
              echo "${{ steps.coderabbit.outputs.notes }}"
            else
              echo "${{ steps.changelog.outputs.unreleased }}"
            fi
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # Commit and push version bump + CHANGELOG update
      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.next }}"
          git push

      # Create GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.next }}
          release_name: v${{ steps.version.outputs.next }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
