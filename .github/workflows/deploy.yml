name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to Bunny Storage and purge CDN
        uses: Snider/bunnycdn-gh-action@v2.0.1
        with:
          source: dist
          storageZoneName: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          accessKey: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
          zoneId: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          zoneKey: ${{ secrets.BUNNY_PULL_ZONE_KEY }}
