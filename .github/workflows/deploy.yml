name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check dist
        run: pnpm check:dist

      - name: Upload to Bunny Storage
        env:
          BUNNY_STORAGE_ZONE_NAME: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          BUNNY_STORAGE_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ ! -d dist ]]; then
            echo "dist directory not found — build may have failed" >&2
            exit 1
          fi
          while IFS= read -r -d '' file; do
            remote_path="${file#dist/}"
            curl -fsSL -X PUT \
              -H "AccessKey: $BUNNY_STORAGE_ACCESS_KEY" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://storage.bunnycdn.com/$BUNNY_STORAGE_ZONE_NAME/$remote_path"
          done < <(find dist -type f -print0)

      - name: Purge Bunny pull zone cache
        env:
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_PULL_ZONE_KEY: ${{ secrets.BUNNY_PULL_ZONE_KEY }}
        run: |
          curl -fsSL -X POST \
            -H "AccessKey: $BUNNY_PULL_ZONE_KEY" \
            "https://api.bunny.net/pullzone/$BUNNY_PULL_ZONE_ID/purgeCache"
