name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload to Bunny Storage and purge CDN
        uses: Snider/bunnycdn-gh-action@3df476080b46e974aa4830e68abacb88ed7908bf # v2.0.1
        with:
          source: dist
          storageZoneName: ${{ secrets.BUNNY_STORAGE_ZONE_NAME }}
          accessKey: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
          zoneId: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          zoneKey: ${{ secrets.BUNNY_PULL_ZONE_KEY }}
