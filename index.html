<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Spoonbowl - Discover delicious recipes from around the world. Explore, cook, and enjoy!"
    />
    <meta name="theme-color" content="#fcfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#27201c" media="(prefers-color-scheme: dark)" />
    <script>
      // Bootstrap persisted theme before React mounts to prevent theme flash
      // Colors must match ThemeProvider.tsx constants
      const DARK_COLOR = "#27201c"
      const LIGHT_COLOR = "#fcfaf6"
      const stored = localStorage.getItem("spoonbowl-theme")
      const theme = stored === "dark" || stored === "light" ? stored : null
      if (theme) {
        document.documentElement.classList.add(theme)
        const color = theme === "dark" ? DARK_COLOR : LIGHT_COLOR
        document.querySelectorAll('meta[name="theme-color"]').forEach((el) => {
          el.setAttribute("content", color)
        })
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spoonbowl" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Spoonbowl - Recipe Discovery</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spoonbowl" />
    <meta property="og:title" content="Spoonbowl - Recipe Discovery" />
    <meta
      property="og:description"
      content="Discover delicious recipes from around the world. Explore, cook, and enjoy!"
    />
    <meta property="og:image" content="/icons/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spoonbowl - Recipe Discovery" />
    <meta
      name="twitter:description"
      content="Discover delicious recipes from around the world. Explore, cook, and enjoy!"
    />
    <meta name="twitter:image" content="/icons/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
